name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner already ships the Android SDK; we just point Gradle at
      # it and top up the exact platform/build-tools we compile against. (The
      # android-actions/setup-android action is intentionally avoided: on current
      # runner images it fails trying to install the retired "tools" package.)
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Firebase Google Sign-In needs the APK signing fingerprint. The keystore
      # location varies between runner images, so try keytool on whatever
      # debug.keystore exists and always fall back to reading the signed APK.
      - name: Print debug signing SHA-1
        if: always()
        run: |
          KEYSTORE="$(find /home/runner /root /usr/local/lib/android -maxdepth 5 -name debug.keystore 2>/dev/null | head -n1)"
          if [ -n "$KEYSTORE" ]; then
            echo "Keystore: $KEYSTORE"
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -storepass android -keypass android \
              | grep -E "SHA1:|SHA-1:|SHA256:" || true
          else
            echo "debug.keystore not found; reading certificate from the APK"
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort | tail -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
              | grep -E "Signer #1 certificate (DN|SHA-1|SHA-256)" || true
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hafezy-Quran-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
