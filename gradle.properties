# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# The project is AndroidX-only; Jetifier rewrites any transitive `android.support.*`
# reference (including the legacy Pdfium binding) so a stray support-lib class can
# never reach the runtime as an unresolvable `android.support.v4.util.ArrayMap`.
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official
